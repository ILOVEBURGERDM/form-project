<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Project</title>
    <link href="styles.css" rel="stylesheet" />
  </head>
  <body>
    <div class="web">
      <div class="left-section">
        <img
          src="images/photo-1585202900225-6d3ac20a6962.avif"
          id="logoImage"
        />
      </div>
      <div class="right-section">
        <h2>
          This is not a real online service! You need something like this in
          your real life to help realize your deepest dreams. Sign up now to get
          started
        </h2>
        <h3>You know you want this</h3>
        <form>
          <h2>Let's Do This</h2>

          <div class="forms">
            <div class="form-section" id="left-form">
              <div>
                <p class="formTags">First Name</p>
                <input type="text" name="signup" id="first_name" />
              </div>

              <div>
                <p class="formTags">Email</p>
                <input type="email" name="signup" id="email" />
              </div>

              <div>
                <p class="formTags">Password</p>
                <input type="text" name="signup" id="password" />
              </div>
            </div>
            <div class="form-section" id="right-form">
              <div>
                <p class="formTags">Last Name</p>
                <input type="text" name="signup" id="last_name" />
              </div>

              <div>
                <p class="formTags">Phone Number</p>
                <input type="text" name="signup" id="phone" />
              </div>

              <div>
                <p class="formTags">Confirm Password</p>
                <input type="text" name="signup" id="cfmPassword" />
              </div>
            </div>
          </div>
        </form>
        <button class="accountBtn">Create Accont</button>
        <p>Already have an account?</p>
      </div>
    </div>
  </body>
</html>
